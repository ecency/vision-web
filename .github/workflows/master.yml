name: Master CI/CD
on:
  push:
    branches:
      - main
# Default to read-only access for GITHUB_TOKEN. Deploy jobs use SSH and
# don't need any GitHub API access; the build job pushes only to Docker
# Hub (external). Per-job overrides can be added if a step ever needs
# write access on GitHub itself.
# Concurrency is declared PER JOB below, not here: a workflow-level group would cancel
# the whole run, deploy included. Splitting it lets the expensive test/build phase be
# cancelled when a newer commit supersedes it, while an in-flight deploy is allowed to
# finish and the next one queues behind it.
permissions:
  contents: read
jobs:
  tests:
    # Build phase cancels; see the deploy jobs below for why deploys do not.
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_GMAPS_API_KEY: ${{ secrets.GMAPS_API_KEY }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUB_KEY }}
      NEXT_PUBLIC_GMAPS_MAP_ID: ${{ secrets.GMAPS_MAP_ID }}
      NEXT_PUBLIC_TURNSTILE_SITEKEY: ${{ secrets.TURNSTILE_SITEKEY }}
    strategy:
      matrix:
        node-version: [24.x]
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v3
      with:
        version: 11.5.0
        run_install: false
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      env:
        CI: true
    # Packages first: apps/web resolves `@ecency/sdk` to the COMMITTED
    # packages/sdk/dist, so testing before this builds against a stale dist.
    - name: Build packages
      run: pnpm build:packages
    - name: Run Tests
      run: pnpm -r test
    - name: Build web app
      run: pnpm --filter @ecency/web build
      env:
        CI: true
  build:
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.ref }}
      cancel-in-progress: true
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: ecency/vision-web:latest
          # Always fetch the image being replaced: the Dockerfile carries its static
          # assets forward (retain-static.js, #1615), so a stale local copy would
          # retain the wrong build.
          pull: true
          build-args: |
            PREVIOUS_IMAGE=ecency/vision-web:latest
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            SENTRY_ORG=ecency
            SENTRY_PROJECT=ecency-next
            SENTRY_RELEASE=ecency-next@${{ github.sha }}
            SENTRY_ENVIRONMENT=production
            NEXT_PUBLIC_GMAPS_API_KEY=${{ secrets.GMAPS_API_KEY }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUB_KEY }}
            NEXT_PUBLIC_GMAPS_MAP_ID=${{ secrets.GMAPS_MAP_ID }}
            NEXT_PUBLIC_TURNSTILE_SITEKEY=${{ secrets.TURNSTILE_SITEKEY }}
            PNPM_VERSION=10.18.1

      # Sentry's source-map upload runs inside the Docker build via the
      # @sentry/nextjs webpack plugin (see apps/web/next.config.js). It can
      # silently no-op if the auth token is invalid, scope-restricted, or
      # rate-limited — verify the release was created and at least one
      # file is attached before letting the deploy jobs proceed.
      - name: Verify Sentry source maps uploaded
        uses: ./.github/actions/verify-sentry-release
        with:
          release: ecency-next@${{ github.sha }}
          auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

  deploy-EU:
    # Production deploy queues rather than cancels: interrupting an SSH/compose run leaves
    # the host partially updated, and if the superseding run fails before its own deploy,
    # nothing re-applies it. Keyed per region so EU and US do not block each other.
    concurrency:
      group: ${{ github.workflow }}-deploy-EU-${{ github.ref }}
      cancel-in-progress: false
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: SSH and deploy node app
      uses: appleboy/ssh-action@v1.0.3
      env:
        USE_PRIVATE: ${{secrets.USE_PRIVATE}}
        PRIVATE_API_ADDR: ${{secrets.PRIVATE_API_ADDR}}
        PRIVATE_API_AUTH: ${{secrets.PRIVATE_API_AUTH}}
        HIVESIGNER_SECRET: ${{secrets.HIVESIGNER_SECRET}}
        SEARCH_API_ADDR: ${{secrets.SEARCH_API_ADDR}}
        SEARCH_API_SECRET: ${{secrets.SEARCH_API_SECRET}}
        STRIPE_INTERNAL_SECRET: ${{secrets.STRIPE_INTERNAL_SECRET}}
        HOSTING_INTERNAL_SECRET: ${{secrets.HOSTING_INTERNAL_SECRET}}
        NEWSLETTER_API_URL: ${{secrets.NEWSLETTER_API_URL}}
        NEWSLETTER_SERVICE_TOKEN: ${{secrets.NEWSLETTER_SERVICE_TOKEN}}
        HIVESEARCHER_ORIGIN_IP: ${{secrets.HIVESEARCHER_ORIGIN_IP}}
        PLAUSIBLE_API_KEY: ${{secrets.PLAUSIBLE_API_KEY}}
        BLOCKSTREAM_CLIENT_ID: ${{secrets.BLOCKSTREAM_CLIENT_ID}}
        BLOCKSTREAM_CLIENT_SECRET: ${{secrets.BLOCKSTREAM_CLIENT_SECRET}}
        MATTERMOST_BASE_URL: ${{secrets.MATTERMOST_BASE_URL}}
        MATTERMOST_ADMIN_TOKEN: ${{secrets.MATTERMOST_ADMIN_TOKEN}}
        MATTERMOST_TEAM_ID: ${{secrets.MATTERMOST_TEAM_ID}}
        MATTERMOST_WS_ALLOWED_ORIGINS: ${{secrets.MATTERMOST_WS_ALLOWED_ORIGINS}}
        THREESPEAK_EMBED_API_KEY: ${{secrets.THREESPEAK_EMBED_API_KEY}}
        SEO_CRON_SECRET: ${{secrets.SEO_CRON_SECRET}}
        TURNSTILE_SECRET: ${{secrets.TURNSTILE_SECRET}}
        SSR_INTERNAL_SECRET: ${{secrets.SSR_INTERNAL_SECRET}}
      with:
        host: ${{ secrets.SSH_HOST_EU }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.SSH_PORT }}
        envs: USE_PRIVATE,PRIVATE_API_ADDR,PRIVATE_API_AUTH,HIVESIGNER_SECRET,SEARCH_API_ADDR,SEARCH_API_SECRET,STRIPE_INTERNAL_SECRET,HOSTING_INTERNAL_SECRET,HIVESEARCHER_ORIGIN_IP,PLAUSIBLE_API_KEY,BLOCKSTREAM_CLIENT_ID,BLOCKSTREAM_CLIENT_SECRET,MATTERMOST_TEAM_ID,MATTERMOST_ADMIN_TOKEN,MATTERMOST_BASE_URL,MATTERMOST_WS_ALLOWED_ORIGINS,THREESPEAK_EMBED_API_KEY,SEO_CRON_SECRET,TURNSTILE_SECRET,NEWSLETTER_API_URL,NEWSLETTER_SERVICE_TOKEN,SSR_INTERNAL_SECRET
        script: |
          set -eo pipefail
          export USE_PRIVATE=$USE_PRIVATE
          export PRIVATE_API_ADDR=$PRIVATE_API_ADDR
          export PRIVATE_API_AUTH=$PRIVATE_API_AUTH
          export HIVESIGNER_SECRET=$HIVESIGNER_SECRET
          export SEARCH_API_ADDR=$SEARCH_API_ADDR
          export SEARCH_API_SECRET=$SEARCH_API_SECRET
          export STRIPE_INTERNAL_SECRET=$STRIPE_INTERNAL_SECRET
          export HOSTING_INTERNAL_SECRET=$HOSTING_INTERNAL_SECRET
          # The web tier decides per request whether the newsletter service is configured, so a
          # missing secret would ship a silent no-show. Fail loudly instead.
          : "${NEWSLETTER_API_URL:?NEWSLETTER_API_URL is required for the EU deploy}"
          : "${NEWSLETTER_SERVICE_TOKEN:?NEWSLETTER_SERVICE_TOKEN is required for the EU deploy}"
          export NEWSLETTER_API_URL=$NEWSLETTER_API_URL
          export NEWSLETTER_SERVICE_TOKEN=$NEWSLETTER_SERVICE_TOKEN
          export HIVESEARCHER_ORIGIN_IP=$HIVESEARCHER_ORIGIN_IP
          export PLAUSIBLE_API_KEY=$PLAUSIBLE_API_KEY
          export BLOCKSTREAM_CLIENT_ID=$BLOCKSTREAM_CLIENT_ID
          export BLOCKSTREAM_CLIENT_SECRET=$BLOCKSTREAM_CLIENT_SECRET
          export THREESPEAK_EMBED_API_KEY=$THREESPEAK_EMBED_API_KEY
          export SEO_CRON_SECRET=$SEO_CRON_SECRET
          export TURNSTILE_SECRET=$TURNSTILE_SECRET
          export SSR_INTERNAL_SECRET=$SSR_INTERNAL_SECRET
          # The web sizing knobs default in compose, so `docker-compose config`
          # would otherwise read whatever the HOST happens to have exported and
          # this region's memory profile could change with no commit behind it.
          # EU pins its own values here: same numbers as the compose defaults,
          # stated rather than inherited.
          unset WEB_REPLICAS WEB_HEAP_MB WEB_MEM_LIMIT WEB_UPDATE_ORDER
          cd ~/vision-web
          git pull origin main
          cd apps/web
          docker network inspect vision >/dev/null 2>&1 || docker network create --driver overlay vision
          docker pull ecency/api:latest
          web_pull="$(docker pull ecency/vision-web:latest)"; printf '%s\n' "$web_pull"
          STACK_FILE="$(mktemp)"; trap 'rm -f "$STACK_FILE"' EXIT
          docker-compose -f docker-compose.production.yml config > "$STACK_FILE"
          docker stack deploy -c "$STACK_FILE" vision
          # Don't report a green deploy unless the new image actually rolled out.
          # `docker stack deploy` returns as soon as the spec is committed to Raft
          # (before Swarm populates UpdateStatus), so a crash-on-start (-> rollback)
          # or a stuck/slow rollout would otherwise pass silently. When a new image
          # was pulled, wait for vision_web to reach `completed`: never accept an
          # empty/`updating` reading as success, fail immediately on rollback/pause,
          # and fail on timeout in any non-`completed` state. Skip the wait only
          # when the image was unchanged (genuine no-op, nothing to roll out).
          if printf '%s' "$web_pull" | grep -q 'Image is up to date'; then
            echo "vision_web image unchanged; no rollout expected"
          else
            state=""
            for i in $(seq 1 60); do
              state="$(docker service inspect vision_web --format '{{if .UpdateStatus}}{{.UpdateStatus.State}}{{end}}' 2>/dev/null || echo "")"
              case "$state" in
                completed) break ;;
                rollback_*|paused)
                  echo "::error::vision_web rolled back (UpdateStatus=$state); prod still on the previous image"
                  exit 1 ;;
              esac
              sleep 5
            done
            if [ "$state" != "completed" ]; then
              echo "::error::vision_web did not converge within ~5m (UpdateStatus=${state:-empty}); prod may still be on the previous image"
              exit 1
            fi
            echo "vision_web converged (UpdateStatus=completed)"
          fi
          docker system prune -f

  deploy-US:
    concurrency:
      group: ${{ github.workflow }}-deploy-US-${{ github.ref }}
      cancel-in-progress: false
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: SSH and deploy node app
      uses: appleboy/ssh-action@v1.0.3
      env:
        USE_PRIVATE: ${{secrets.USE_PRIVATE}}
        PRIVATE_API_ADDR: ${{secrets.PRIVATE_API_ADDR}}
        PRIVATE_API_AUTH: ${{secrets.PRIVATE_API_AUTH}}
        HIVESIGNER_SECRET: ${{secrets.HIVESIGNER_SECRET}}
        SEARCH_API_ADDR: ${{secrets.SEARCH_API_ADDR}}
        SEARCH_API_SECRET: ${{secrets.SEARCH_API_SECRET}}
        STRIPE_INTERNAL_SECRET: ${{secrets.STRIPE_INTERNAL_SECRET}}
        HOSTING_INTERNAL_SECRET: ${{secrets.HOSTING_INTERNAL_SECRET}}
        HIVESEARCHER_ORIGIN_IP: ${{secrets.HIVESEARCHER_ORIGIN_IP}}
        PLAUSIBLE_API_KEY: ${{secrets.PLAUSIBLE_API_KEY}}
        BLOCKSTREAM_CLIENT_ID: ${{secrets.BLOCKSTREAM_CLIENT_ID}}
        BLOCKSTREAM_CLIENT_SECRET: ${{secrets.BLOCKSTREAM_CLIENT_SECRET}}
        MATTERMOST_BASE_URL: ${{secrets.MATTERMOST_BASE_URL}}
        MATTERMOST_ADMIN_TOKEN: ${{secrets.MATTERMOST_ADMIN_TOKEN}}
        MATTERMOST_TEAM_ID: ${{secrets.MATTERMOST_TEAM_ID}}
        MATTERMOST_WS_ALLOWED_ORIGINS: ${{secrets.MATTERMOST_WS_ALLOWED_ORIGINS}}
        THREESPEAK_EMBED_API_KEY: ${{secrets.THREESPEAK_EMBED_API_KEY}}
        SEO_CRON_SECRET: ${{secrets.SEO_CRON_SECRET}}
        TURNSTILE_SECRET: ${{secrets.TURNSTILE_SECRET}}
        SSR_INTERNAL_SECRET: ${{secrets.SSR_INTERNAL_SECRET}}
        # Newsletter service lives on the EU box; the US tier reaches it through the TLS relay
        # on the EU origin (api.blogs.ecency.com/newsletter-relay, IP-allowlisted), so this
        # region's URL is its own secret. Same token.
        NEWSLETTER_API_URL: ${{secrets.NEWSLETTER_API_URL_US}}
        NEWSLETTER_SERVICE_TOKEN: ${{secrets.NEWSLETTER_SERVICE_TOKEN}}
        # This region's host is the smaller of the two. Four replicas once
        # cycled it out of RAM: each settled far above where they sit now,
        # because the heap climbed toward its cap for as long as the process
        # lived. SSR_MAX_INFLIGHT removed that climb, which is what makes a
        # fourth replica arguable at all.
        #
        # A plateau is behaviour, not a bound, so the sizing here is derived
        # from the cgroup limit, which is enforced. The per-host budget behind
        # these numbers lives with the infrastructure notes, not in this repo.
        #
        # stop-first belongs to that budget rather than being a preference:
        # start-first runs a FIFTH task through every rollout and the budget
        # does not cover one. Losing a replica briefly is what admission
        # control already absorbs by shedding to the other region.
        #
        # The heap cap sits under the cgroup limit with room for what lives
        # outside old space, and was measured on this host at this value
        # before being set: it plateaued, with no restarts and a few percent
        # more CPU, which four replicas repay by each carrying less traffic.
        WEB_REPLICAS: "4"
        WEB_HEAP_MB: "1536"
        WEB_MEM_LIMIT: "2304M"
        WEB_UPDATE_ORDER: "stop-first"
      with:
        host: ${{ secrets.SSH_HOST_US }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.SSH_PORT }}
        envs: USE_PRIVATE,PRIVATE_API_ADDR,PRIVATE_API_AUTH,HIVESIGNER_SECRET,SEARCH_API_ADDR,SEARCH_API_SECRET,STRIPE_INTERNAL_SECRET,HOSTING_INTERNAL_SECRET,HIVESEARCHER_ORIGIN_IP,PLAUSIBLE_API_KEY,BLOCKSTREAM_CLIENT_ID,BLOCKSTREAM_CLIENT_SECRET,MATTERMOST_TEAM_ID,MATTERMOST_ADMIN_TOKEN,MATTERMOST_BASE_URL,MATTERMOST_WS_ALLOWED_ORIGINS,THREESPEAK_EMBED_API_KEY,SEO_CRON_SECRET,TURNSTILE_SECRET,NEWSLETTER_API_URL,NEWSLETTER_SERVICE_TOKEN,WEB_REPLICAS,WEB_HEAP_MB,WEB_MEM_LIMIT,WEB_UPDATE_ORDER,SSR_INTERNAL_SECRET
        script: |
          set -eo pipefail
          export USE_PRIVATE=$USE_PRIVATE
          export PRIVATE_API_ADDR=$PRIVATE_API_ADDR
          export PRIVATE_API_AUTH=$PRIVATE_API_AUTH
          export HIVESIGNER_SECRET=$HIVESIGNER_SECRET
          export SEARCH_API_ADDR=$SEARCH_API_ADDR
          export SEARCH_API_SECRET=$SEARCH_API_SECRET
          export STRIPE_INTERNAL_SECRET=$STRIPE_INTERNAL_SECRET
          export HOSTING_INTERNAL_SECRET=$HOSTING_INTERNAL_SECRET
          export HIVESEARCHER_ORIGIN_IP=$HIVESEARCHER_ORIGIN_IP
          export PLAUSIBLE_API_KEY=$PLAUSIBLE_API_KEY
          export BLOCKSTREAM_CLIENT_ID=$BLOCKSTREAM_CLIENT_ID
          export BLOCKSTREAM_CLIENT_SECRET=$BLOCKSTREAM_CLIENT_SECRET
          export THREESPEAK_EMBED_API_KEY=$THREESPEAK_EMBED_API_KEY
          export SEO_CRON_SECRET=$SEO_CRON_SECRET
          export TURNSTILE_SECRET=$TURNSTILE_SECRET
          export SSR_INTERNAL_SECRET=$SSR_INTERNAL_SECRET
          # The web tier decides per request whether the newsletter service is configured, so a
          # missing secret would ship a silent no-show. Fail loudly instead.
          : "${NEWSLETTER_API_URL:?NEWSLETTER_API_URL is required for the US deploy}"
          : "${NEWSLETTER_SERVICE_TOKEN:?NEWSLETTER_SERVICE_TOKEN is required for the US deploy}"
          export NEWSLETTER_API_URL=$NEWSLETTER_API_URL
          export NEWSLETTER_SERVICE_TOKEN=$NEWSLETTER_SERVICE_TOKEN
          export WEB_REPLICAS=$WEB_REPLICAS
          # These three are this region's memory budget. Compose defaults to
          # the other region's values, so a dropped variable would deploy four
          # replicas at the wrong cap -- the configuration that cycled this
          # host out of RAM. Fail the deploy instead of shipping it.
          : "${WEB_HEAP_MB:?WEB_HEAP_MB is required for the US deploy}"
          : "${WEB_MEM_LIMIT:?WEB_MEM_LIMIT is required for the US deploy}"
          : "${WEB_UPDATE_ORDER:?WEB_UPDATE_ORDER is required for the US deploy}"
          case "$WEB_HEAP_MB" in ''|*[!0-9]*) echo "WEB_HEAP_MB must be a number of MiB" >&2; exit 1;; esac
          export WEB_HEAP_MB=$WEB_HEAP_MB
          export WEB_MEM_LIMIT=$WEB_MEM_LIMIT
          export WEB_UPDATE_ORDER=$WEB_UPDATE_ORDER
          cd ~/vision-web
          git pull origin main
          cd apps/web
          docker network inspect vision >/dev/null 2>&1 || docker network create --driver overlay vision
          docker pull ecency/api:latest
          web_pull="$(docker pull ecency/vision-web:latest)"; printf '%s\n' "$web_pull"
          STACK_FILE="$(mktemp)"; trap 'rm -f "$STACK_FILE"' EXIT
          docker-compose -f docker-compose.production.yml config > "$STACK_FILE"
          docker stack deploy -c "$STACK_FILE" vision
          # Don't report a green deploy unless the new image actually rolled out.
          # `docker stack deploy` returns as soon as the spec is committed to Raft
          # (before Swarm populates UpdateStatus), so a crash-on-start (-> rollback)
          # or a stuck/slow rollout would otherwise pass silently. When a new image
          # was pulled, wait for vision_web to reach `completed`: never accept an
          # empty/`updating` reading as success, fail immediately on rollback/pause,
          # and fail on timeout in any non-`completed` state. Skip the wait only
          # when the image was unchanged (genuine no-op, nothing to roll out).
          if printf '%s' "$web_pull" | grep -q 'Image is up to date'; then
            echo "vision_web image unchanged; no rollout expected"
          else
            state=""
            for i in $(seq 1 60); do
              state="$(docker service inspect vision_web --format '{{if .UpdateStatus}}{{.UpdateStatus.State}}{{end}}' 2>/dev/null || echo "")"
              case "$state" in
                completed) break ;;
                rollback_*|paused)
                  echo "::error::vision_web rolled back (UpdateStatus=$state); prod still on the previous image"
                  exit 1 ;;
              esac
              sleep 5
            done
            if [ "$state" != "completed" ]; then
              echo "::error::vision_web did not converge within ~5m (UpdateStatus=${state:-empty}); prod may still be on the previous image"
              exit 1
            fi
            echo "vision_web converged (UpdateStatus=completed)"
          fi
          docker system prune -f
