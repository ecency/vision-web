name: Auto Changeset Fork Release

# Second half of auto-changeset.yml for PRs from forks. That run built the
# fork's source on an unprivileged pull_request job and uploaded the result as
# a patch. This run has write access, so it executes nothing from the fork: it
# applies the patch as data, refuses anything outside version/changelog/dist
# paths, and pushes the fork's commits plus OUR build to release/pr-<N>.
# Merging the PR opened from that branch also marks the fork PR as merged.

on:
  workflow_run:
    workflows: [Auto Generate Changeset]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  release-branch:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - name: Find the fork-release artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          count=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name == "fork-release" and (.expired | not))] | length')
          echo "found=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        if: steps.artifact.outputs.found == 'true'
        with:
          name: fork-release
          path: ${{ runner.temp }}/fork-release
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # The artifact is written by fork code. Its PR number and head SHA are only
      # accepted when they match the open PR GitHub reports for this run.
      - name: Resolve the PR
        id: pr
        if: steps.artifact.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DIR: ${{ runner.temp }}/fork-release
        run: |
          set -euo pipefail
          claimed_pr=$(tr -cd '0-9' < "$DIR/pr-number")
          claimed_sha=$(tr -cd '0-9a-f' < "$DIR/head-sha")
          if [ "$claimed_sha" != "$RUN_HEAD_SHA" ]; then
            echo "::error::artifact head SHA does not match the workflow run"
            exit 1
          fi
          pr=$(gh api "repos/$REPO/pulls/$claimed_pr")
          if [ "$(jq -r .state <<<"$pr")" != "open" ] \
            || [ "$(jq -r .head.sha <<<"$pr")" != "$RUN_HEAD_SHA" ] \
            || [ "$(jq -r .head.repo.full_name <<<"$pr")" = "$REPO" ]; then
            echo "::error::PR #$claimed_pr is not an open fork PR at $RUN_HEAD_SHA (it may have moved on; relabel to rerun)"
            exit 1
          fi
          {
            echo "number=$claimed_pr"
            echo "base=$(jq -r .base.ref <<<"$pr")"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.artifact.outputs.found == 'true'
        with:
          fetch-depth: 0

      - name: Apply our build on top of the PR head
        if: steps.artifact.outputs.found == 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DIR: ${{ runner.temp }}/fork-release
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"
          git checkout -B "release/pr-${PR_NUMBER}" "$HEAD_SHA"

          git apply --index --binary "$DIR/release.patch"

          bad=$(git diff --cached --name-only \
            | grep -vE '^(\.changeset/[^/]+\.md|packages/(sdk|wallets|render-helper|ui)/(dist/.+|package\.json|CHANGELOG\.md))$' || true)
          if [ -n "$bad" ]; then
            echo "::error::patch touches paths outside version/changelog/dist:"
            echo "$bad"
            exit 1
          fi
          # Regular files only: no symlinks or submodules smuggled in under dist
          if git diff --cached --summary | grep -qE 'mode (120000|160000)'; then
            echo "::error::patch adds a symlink or submodule"
            exit 1
          fi
          # package.json: only the version and internal @ecency/* ranges may move
          bad=$(git diff --cached -U0 -- 'packages/*/package.json' \
            | grep -E '^[+-][^+-]' \
            | grep -vE '^[+-]\s*"(version|@ecency/[a-z-]+)": "[^"]*",?$' || true)
          if [ -n "$bad" ]; then
            echo "::error::patch changes package.json beyond versions:"
            echo "$bad"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "Nothing to release"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: apply changeset versioning for PR #${PR_NUMBER}"
          git push --force origin "HEAD:refs/heads/release/pr-${PR_NUMBER}"

      - name: Point the PR at the release branch
        if: steps.artifact.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          BASE: ${{ steps.pr.outputs.base }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          branch="release/pr-${PR_NUMBER}"
          if ! git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null; then exit 0; fi
          existing=$(gh pr list -R "$REPO" --head "$branch" --state open --json number --jq '.[0].number // empty')
          # Our build still runs this PR's build config, so changes there need a
          # reviewer's eye before the rebuilt dist can be trusted.
          build_inputs=$(git diff --name-only "origin/$BASE...$HEAD_SHA" \
            | grep -E '(^|/)(tsup\.config\.[a-z]+|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml)$|^packages/[^/]+/scripts/|^\.changeset/config\.json$|^patches/' || true)
          {
            echo "Versioned and rebuilt from source at \`${HEAD_SHA:0:10}\` on \`$branch\`. The dist there is our CI build of this PR's source, not the dist committed in this PR."
            echo
            if [ -n "$build_inputs" ]; then
              echo "⚠️ This PR changes build inputs. Review them before trusting the rebuilt dist:"
              echo "$build_inputs" | sed 's/^/- `/; s/$/`/'
              echo
            fi
            if [ -n "$existing" ]; then
              echo "Release PR: #$existing. It was force-pushed, and pushes by Actions do not start checks, so close and reopen it to rerun them."
            else
              echo "Open the release PR (checks only start when a person opens it): https://github.com/$REPO/compare/$BASE...$branch?expand=1"
            fi
            echo
            echo "Merging the release PR also marks this PR as merged."
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR_NUMBER" -R "$REPO" --body-file "$RUNNER_TEMP/comment.md"
