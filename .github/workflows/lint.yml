name: Lint
# pull_request (not a branch-filtered push) so a required check still reports on PRs whose
# head branch doesn't match a naming convention — Dependabot/Renovate/hotfix/bot branches —
# which would otherwise be permanently blocked once this is a required status check.
on:
  pull_request:
# Lint only — no writes back to GitHub.
# Superseded runs are cancelled: pushing again to a PR makes the previous lint result
# irrelevant, so letting it finish only burns runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 11.5.0
          run_install: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm -r lint
      # `pnpm -r lint` runs each package's own eslint binary, so a workspace-root
      # eslint on a major that cannot read the packages' flat configs stays
      # invisible here while breaking every root-resolved invocation - `npx eslint`
      # inside a package and editor ESLint servers both resolve to the workspace
      # root, because the root package.json declares `workspaces`. That skew is
      # what #1335 hit. Run one flat-config package through the root-resolved
      # binary so the next skew fails here instead of at a desk.
      - name: Root-resolved eslint reads the packages' flat configs
        run: cd packages/sdk && "$GITHUB_WORKSPACE/node_modules/.bin/eslint" .
