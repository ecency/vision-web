name: Self-Hosted CI/CD

on:
  push:
    branches:
      - develop
      - main
    # A release: tagging self-hosted-vX.Y.Z builds the same images with an
    # immutable version tag, so independent deployments can pin something
    # meaningful instead of a commit sha. Tag pushes build and publish only;
    # the deploy job stays develop-gated below.
    tags:
      - 'self-hosted-v*'
    paths:
      - 'apps/self-hosted/**'
      - 'packages/sdk/**'
      - 'packages/render-helper/**'
      - 'packages/wallets/**'
      - 'packages/ui/**'
      # Root dependency inputs: the Dockerfile copies all of these before
      # installing, so a lockfile bump, an override or a patch can change the
      # emitted chunks without any file above being touched.
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
  # Tests and the app build also run on pull requests. Without this the first
  # time anything is compiled is the deploy, which serves live blogs: a bundle
  # that threw at load reached production that way and blanked every instance.
  # The image build and the deploy stay push-only, so a pull request needs no
  # secrets and can neither publish an image nor touch a server.
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'apps/self-hosted/**'
      - 'packages/sdk/**'
      - 'packages/render-helper/**'
      - 'packages/wallets/**'
      - 'packages/ui/**'
      # Root dependency inputs: the Dockerfile copies all of these before
      # installing, so a lockfile bump, an override or a patch can change the
      # emitted chunks without any file above being touched.
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      # Deliberately only on this side. A change to this file should prove itself
      # on its own pull request, but merging one should not redeploy an app whose
      # code did not change, and develop deploys with no staging tier in between.
      - '.github/workflows/self-hosted.yml'

# Default to read-only GITHUB_TOKEN. Build pushes to Docker Hub (external);
# deploy jobs SCP/SSH to servers — neither path needs GitHub write access.
# Concurrency is declared PER JOB below, not here: a workflow-level group would cancel
# the whole run, deploy included. Splitting it lets the expensive test/build phase be
# cancelled when a newer commit supersedes it, while an in-flight deploy is allowed to
# finish and the next one queues behind it.
permissions:
  contents: read

jobs:
  tests:
    # Build phase cancels, keyed on the ref: develop and main build different images, so
    # they must not cancel each other.
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 11.5.0
          run_install: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          CI: true
      - name: Run self-hosted tests
        run: pnpm --filter @ecency/self-hosted test
      # Hosting API is a standalone npm project (not part of pnpm workspace)
      # with its own Dockerfile and independent dependency tree
      - name: Run hosting API tests
        # npm ci, matching the image build: lockfile drift fails HERE, loudly,
        # instead of the image quietly resolving something newer.
        run: cd apps/self-hosted/hosting/api && npm ci && npm test

      # Operator scripts are not part of any package: they run from a timer on the
      # host that holds the key, so nothing else would ever execute them. stdlib
      # unittest only, so this needs no more than the python3 already on the runner.
      - name: Run hosting script tests
        run: cd apps/self-hosted/hosting/scripts && python3 -m unittest discover -p 'test_*.py'

      # The unit tests never compile the app, so a bundle that only fails at
      # load used to reach production uncompiled. This is also what runs
      # scripts/check-node-globals.mjs, which fails on a Node global that
      # Rsbuild does not provide.
      #
      # The shared packages are built first, in the same order as
      # apps/self-hosted/Dockerfile. They resolve through their committed dist
      # (and rsbuild.config.ts aliases @ecency/ui straight at it), so skipping
      # this bundles whatever dist happens to be checked in and tests a
      # different artifact than the image ships. A regression introduced in a
      # package's source would then pass here and still reach production, which
      # is how the last one arrived: it came from render-helper.
      - name: Build shared packages
        run: |
          pnpm --filter @ecency/sdk build
          pnpm --filter @ecency/render-helper build
          pnpm --filter @ecency/ui build
          pnpm --filter @ecency/wallets build
        env:
          CI: true

      - name: Build the self-hosted app
        run: |
          # Mirrors the Dockerfile: config.json is gitignored, so fall back to
          # the template exactly as the image build does.
          [ -f apps/self-hosted/config.json ] \
            || cp apps/self-hosted/config.template.json apps/self-hosted/config.json
          pnpm --filter @ecency/self-hosted build
        env:
          CI: true

  build-blog:
    # Its own group: build-blog and build-api run in parallel and would otherwise cancel
    # each other.
    concurrency:
      group: ${{ github.workflow }}-build-blog-${{ github.ref }}
      cancel-in-progress: true
    needs: tests
    # Publishes to Docker Hub, so it needs secrets a fork pull request cannot have
    # and produces an artifact a pull request has no use for.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine tags
        id: tag
        run: |
          SHA_TAG="sha-${GITHUB_SHA::7}"
          if [[ "${{ github.ref }}" == refs/tags/self-hosted-v* ]]; then
            # Release tag: an immutable version tag plus latest, since a
            # release IS what latest means to an independent deployment.
            # Strict semver only: a typo'd tag must fail loudly here, not
            # publish a junk tag and advance latest.
            if [[ ! "$GITHUB_REF_NAME" =~ ^self-hosted-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Release tag '$GITHUB_REF_NAME' is not self-hosted-vX.Y.Z"
              exit 1
            fi
            CHANNEL_TAG="latest"
            VERSION_TAG="${GITHUB_REF_NAME#self-hosted-}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            # main gets its own channel; latest moves ONLY on releases, or
            # the next untagged main commit would silently overwrite what a
            # release just pinned.
            CHANNEL_TAG="main"
            VERSION_TAG=""
          else
            CHANNEL_TAG="develop"
            VERSION_TAG=""
          fi
          echo "sha=$SHA_TAG" >> $GITHUB_OUTPUT
          echo "channel=$CHANNEL_TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION_TAG" >> $GITHUB_OUTPUT

      - name: Build and push blog image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/self-hosted/Dockerfile
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            RELEASE_VERSION=${{ steps.tag.outputs.version }}
          tags: |
            ecency/self-hosted:${{ steps.tag.outputs.sha }}
            ecency/self-hosted:${{ steps.tag.outputs.channel }}
            ${{ steps.tag.outputs.version != '' && format('ecency/self-hosted:{0}', steps.tag.outputs.version) || '' }}

  build-api:
    concurrency:
      group: ${{ github.workflow }}-build-api-${{ github.ref }}
      cancel-in-progress: true
    needs: tests
    # Push-only, for the same reasons as build-blog.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine tags
        id: tag
        run: |
          SHA_TAG="sha-${GITHUB_SHA::7}"
          if [[ "${{ github.ref }}" == refs/tags/self-hosted-v* ]]; then
            # Release tag: an immutable version tag plus latest, since a
            # release IS what latest means to an independent deployment.
            # Strict semver only: a typo'd tag must fail loudly here, not
            # publish a junk tag and advance latest.
            if [[ ! "$GITHUB_REF_NAME" =~ ^self-hosted-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Release tag '$GITHUB_REF_NAME' is not self-hosted-vX.Y.Z"
              exit 1
            fi
            CHANNEL_TAG="latest"
            VERSION_TAG="${GITHUB_REF_NAME#self-hosted-}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            # main gets its own channel; latest moves ONLY on releases, or
            # the next untagged main commit would silently overwrite what a
            # release just pinned.
            CHANNEL_TAG="main"
            VERSION_TAG=""
          else
            CHANNEL_TAG="develop"
            VERSION_TAG=""
          fi
          echo "sha=$SHA_TAG" >> $GITHUB_OUTPUT
          echo "channel=$CHANNEL_TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION_TAG" >> $GITHUB_OUTPUT

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/self-hosted/hosting/api
          file: ./apps/self-hosted/hosting/api/Dockerfile
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            RELEASE_VERSION=${{ steps.tag.outputs.version }}
          tags: |
            ecency/hosting-api:${{ steps.tag.outputs.sha }}
            ecency/hosting-api:${{ steps.tag.outputs.channel }}
            ${{ steps.tag.outputs.version != '' && format('ecency/hosting-api:{0}', steps.tag.outputs.version) || '' }}

  deploy-staging:
    # The only deploy job. There used to be a second one gated on main, but the two were
    # identical apart from the step label — same host, same ~/hosting compose project,
    # same script — so develop and main were deploying the same stack to the same place
    # and whichever ran last won. main still builds and publishes its own channel tag
    # below; it just no longer redeploys this host.
    # Queues rather than cancels: an interrupted SSH/compose run can leave the host
    # partially updated, and nothing is guaranteed to re-apply it.
    concurrency:
      group: ${{ github.workflow }}-deploy
      cancel-in-progress: false
    needs: [build-blog, build-api]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: apps/self-hosted/hosting

      - name: Sync hosting config to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST_EU }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "apps/self-hosted/hosting/docker-compose.yml,apps/self-hosted/hosting/nginx-multi-tenant.conf,apps/self-hosted/hosting/default-config.json,apps/self-hosted/hosting/db/*"
          target: ~/hosting
          strip_components: 3
          overwrite: true

      # Named 'staging' historically; this host serves the live managed blogs.
      - name: Deploy hosting stack
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_SHA: ${{ github.sha }}
          POSTGRES_PASSWORD: ${{ secrets.HOSTING_POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.HOSTING_JWT_SECRET }}
          PAYMENT_ACCOUNT: ${{ secrets.HOSTING_PAYMENT_ACCOUNT }}
        with:
          host: ${{ secrets.SSH_HOST_EU }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: DEPLOY_SHA,POSTGRES_PASSWORD,JWT_SECRET,PAYMENT_ACCOUNT
          script: |
            IMAGE_TAG="sha-${DEPLOY_SHA::7}"
            export POSTGRES_PASSWORD=$POSTGRES_PASSWORD
            export JWT_SECRET=$JWT_SECRET
            export PAYMENT_ACCOUNT=$PAYMENT_ACCOUNT
            cd ~/hosting
            docker pull ecency/self-hosted:$IMAGE_TAG
            docker pull ecency/hosting-api:$IMAGE_TAG
            TAG=$IMAGE_TAG docker compose up -d
