name: Auto Generate Changeset

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  # Same-repo PRs are versioned and rebuilt on their own branch. A fork's branch
  # cannot be pushed with GITHUB_TOKEN, and its committed dist is the contributor's
  # build, not ours, so fork PRs go through fork-build here and then
  # auto-changeset-fork-release.yml, which pushes the fork job's rebuilt dist to
  # release/pr-<N> for maintainer review.
  gate:
    runs-on: ubuntu-latest
    permissions: {}
    # A <bump>:<package> label names OUR package explicitly, so it always counts.
    # A bare major/minor/patch label only counts on a human-opened PR: Dependabot
    # applies labels by those exact names to describe the DEPENDENCY's semver step,
    # not ours, and reading them as ours versioned @ecency/render-helper 2.5.32 ->
    # 3.0.0 off a patch @xmldom/xmldom bump on #1771. To release a Dependabot PR,
    # label it patch:<package>.
    if: |
      contains(github.event.pull_request.labels.*.name, 'patch:sdk') ||
      contains(github.event.pull_request.labels.*.name, 'patch:wallets') ||
      contains(github.event.pull_request.labels.*.name, 'patch:render-helper') ||
      contains(github.event.pull_request.labels.*.name, 'patch:ui') ||
      contains(github.event.pull_request.labels.*.name, 'minor:sdk') ||
      contains(github.event.pull_request.labels.*.name, 'minor:wallets') ||
      contains(github.event.pull_request.labels.*.name, 'minor:render-helper') ||
      contains(github.event.pull_request.labels.*.name, 'minor:ui') ||
      contains(github.event.pull_request.labels.*.name, 'major:sdk') ||
      contains(github.event.pull_request.labels.*.name, 'major:wallets') ||
      contains(github.event.pull_request.labels.*.name, 'major:render-helper') ||
      contains(github.event.pull_request.labels.*.name, 'major:ui') ||
      (github.event.pull_request.user.login != 'dependabot[bot]' &&
      (contains(github.event.pull_request.labels.*.name, 'patch') ||
      contains(github.event.pull_request.labels.*.name, 'minor') ||
      contains(github.event.pull_request.labels.*.name, 'major')))
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - id: mode
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPO" = "$REPO" ] && [[ "$HEAD_REF" == release/pr-* ]]; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
          elif [ "$HEAD_REPO" = "$REPO" ]; then
            echo "mode=same-repo" >> "$GITHUB_OUTPUT"
          else
            echo "mode=fork" >> "$GITHUB_OUTPUT"
          fi

  auto-changeset:
    needs: gate
    if: needs.gate.outputs.mode == 'same-repo'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - uses: pnpm/action-setup@v3
        with:
          version: 11.5.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch origin "$BASE_REF"

      - name: Generate changeset, version and rebuild
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          DIFF_BASE: origin/${{ github.event.pull_request.base.ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Older same-repository branches may predate this script; run the
          # trusted copy from the fetched base branch.
          if git cat-file -e "$DIFF_BASE:.github/scripts/auto-changeset.sh" 2>/dev/null; then
            trusted_script=$(git show "$DIFF_BASE:.github/scripts/auto-changeset.sh")
          else
            # While this workflow itself is being introduced, the head has
            # the script but develop does not yet have it.
            trusted_script=$(cat .github/scripts/auto-changeset.sh)
          fi
          bash -c "$trusted_script"

      - name: Commit & push changes (same PR)
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: apply changeset versioning for PR #${PR_NUMBER}"
          git push origin "HEAD:${BRANCH_REF}"

  # Untrusted: the fork's code is installed and built here, so this job runs on
  # pull_request (read-only token, no secrets, PR-scoped cache) and only hands a
  # patch to auto-changeset-fork-release.yml. Never move it to
  # pull_request_target: install scripts there could write the base branch's
  # Actions cache that the deploy workflows restore.
  fork-build:
    needs: gate
    if: needs.gate.outputs.mode == 'fork'
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-fork-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v3
        with:
          version: 11.5.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch base commit
        env:
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags "https://github.com/${REPO}.git" "$BASE_SHA"

      - name: Generate changeset, version and rebuild from source
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          DIFF_BASE: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REBUILD_TOUCHED_DIST: "true"
        run: |
          set -euo pipefail
          # Capture the whole trusted script in this shell before pnpm reads
          # any fork-controlled install config or runs a package build.
          trusted_script=$(git show "$DIFF_BASE:.github/scripts/auto-changeset.sh")
          # A fork can add lifecycle hooks or a pnpmfile that executes even
          # with lifecycle scripts disabled.
          pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
          bash -c "$trusted_script"

      - name: Export patch
        id: patch
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No version or build changes to release"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/fork-release"
          git diff --cached --binary > "$RUNNER_TEMP/fork-release/release.patch"
          echo "$PR_NUMBER" > "$RUNNER_TEMP/fork-release/pr-number"
          echo "$HEAD_SHA" > "$RUNNER_TEMP/fork-release/head-sha"
          echo "$BASE_SHA" > "$RUNNER_TEMP/fork-release/base-sha"
          git diff --cached --stat

      - uses: actions/upload-artifact@v4
        if: steps.patch.outputs.changed == 'true'
        with:
          name: fork-release
          path: ${{ runner.temp }}/fork-release
          retention-days: 7
