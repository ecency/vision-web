# Ecency Managed Hosting Platform
# Multi-tenant blog hosting infrastructure
# SSL terminated by nginx (Cloudflare origin cert + LE wildcard)

services:
  # ==========================================================================
  # Blog Server - Serves static SPA with multi-tenant config routing
  # ==========================================================================
  blog-server:
    image: ecency/self-hosted:${TAG:?TAG environment variable is required}
    container_name: ecency-hosting-blog
    restart: unless-stopped
    # The newsletter subscribe location proxies to the origin vhost on this box;
    # host-gateway is what makes host.docker.internal resolve on Linux Docker.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3100:80"
    volumes:
      - "./nginx-multi-tenant.conf:/etc/nginx/conf.d/default.conf:ro"
      - "tenant-configs:/usr/share/nginx/html/configs"
      - "./default-config.json:/usr/share/nginx/html/configs/default.json:ro"
    networks:
      - ecency-hosting
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # ==========================================================================
  # Hosting API - Tenant management, subscriptions, config generation
  # ==========================================================================
  hosting-api:
    image: ecency/hosting-api:${TAG:?TAG environment variable is required}
    container_name: ecency-hosting-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3101:3001"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/hosting
      - REDIS_URL=redis://redis:6379
      - HIVE_API_URL=${HIVE_API_URL:-https://api.hive.blog}
      - PAYMENT_ACCOUNT=${PAYMENT_ACCOUNT:-ecency.hosting}
      - BASE_DOMAIN=${BASE_DOMAIN:-blogs.ecency.com}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      # Pricing — the API's payment instructions MUST match what the listener credits.
      - MONTHLY_PRICE_HBD=${MONTHLY_PRICE_HBD:-2.000}
      - PRO_UPGRADE_PRICE_HBD=${PRO_UPGRADE_PRICE_HBD:-5.000}
      # x402 rail (Ecency's facilitator). Empty disables the x402 option in the UI.
      - X402_FACILITATOR_URL=${X402_FACILITATOR_URL:-https://x402.ecency.com}
      # Card payments are handled by the central ePoints Stripe rail (no Stripe keys here).
      # ePoints calls the internal activation endpoint with this shared secret; empty = card
      # activation disabled (endpoint fails closed).
      - HOSTING_INTERNAL_SECRET=${HOSTING_INTERNAL_SECRET:-}
      # Comma-separated addresses/CIDRs allowed to reach /v1/internal. Matched against
      # X-Real-IP for requests arriving from a trusted proxy, and against the connection's own
      # address otherwise. Empty (the default) allows every source, so this is inert until an
      # operator sets it; the edge nginx does the same check in front.
      - HOSTING_INTERNAL_ALLOWED_IPS=${HOSTING_INTERNAL_ALLOWED_IPS:-}
      - HOSTING_CARD_ENABLED=${HOSTING_CARD_ENABLED:-true}
      - HOSTING_CARD_USD_CENTS=${HOSTING_CARD_USD_CENTS:-200}
      # Days a lapsed subscription keeps its custom-domain capabilities after expiry.
      # Must match the listener below: both decide the same thing.
      - PRO_GRACE_DAYS=${PRO_GRACE_DAYS:-14}
    volumes:
      - "tenant-configs:/app/configs"
    networks:
      - ecency-hosting
    depends_on:
      - postgres
      - redis

  # ==========================================================================
  # HBD Payment Listener - Monitors blockchain for subscription payments
  # ==========================================================================
  payment-listener:
    image: ecency/hosting-api:${TAG:?TAG environment variable is required}
    command: ["npx", "tsx", "src/payment-listener.ts"]
    # Reuses API image with different entrypoint
    container_name: ecency-hosting-payments
    restart: unless-stopped
    healthcheck:
      disable: true
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/hosting
      - REDIS_URL=redis://redis:6379
      - HIVE_API_URL=${HIVE_API_URL:-https://api.hive.blog}
      - PAYMENT_ACCOUNT=${PAYMENT_ACCOUNT:-ecency.hosting}
      - MONTHLY_PRICE_HBD=${MONTHLY_PRICE_HBD:-2.000}
      - PRO_UPGRADE_PRICE_HBD=${PRO_UPGRADE_PRICE_HBD:-5.000}
      # Maintenance sweeps run here (expiry, abandoned reservations, unverified domain claims).
      - PRO_GRACE_DAYS=${PRO_GRACE_DAYS:-14}
      - UNVERIFIED_DOMAIN_CLAIM_DAYS=${UNVERIFIED_DOMAIN_CLAIM_DAYS:-14}
    volumes:
      # Activating a subscription writes the tenant's served config. Without
      # this mount that write lands in the container's own layer and never
      # reaches the volume nginx serves, so a paying customer gets default.json
      # until the API's periodic sync repairs it.
      - "tenant-configs:/app/configs"
    networks:
      - ecency-hosting
    depends_on:
      - postgres
      - redis

  # ==========================================================================
  # PostgreSQL - Persistent data storage
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: ecency-hosting-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=hosting
    volumes:
      - "postgres-data:/var/lib/postgresql/data"
      - "./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"
    networks:
      - ecency-hosting
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================================
  # Redis - Caching and pub/sub
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: ecency-hosting-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - "redis-data:/data"
    networks:
      - ecency-hosting
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  ecency-hosting:
    name: ecency-hosting
    driver: bridge

volumes:
  tenant-configs:
  postgres-data:
  redis-data:
