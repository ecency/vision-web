version: "3.7"

services:
  vapi:
    image: ecency/api:latest
    # Pin the search backend hostname to the origin IP so vapi connects directly,
    # bypassing a Cloudflare colo<->origin path that can hang for minutes (broke
    # all US-routed search on 2026-06-08). Keeps the hostname for SNI/cert. The IP
    # comes from the HIVESEARCHER_ORIGIN_IP secret (never committed to this public
    # repo); update it if the search box IP changes.
    extra_hosts:
      - "api.hivesearcher.com:${HIVESEARCHER_ORIGIN_IP:?set HIVESEARCHER_ORIGIN_IP secret = hivesearcher origin IP}"
    environment:
      - PRIVATE_API_ADDR
      - PRIVATE_API_AUTH
      - HIVESIGNER_SECRET
      - SEARCH_API_ADDR
      - SEARCH_API_SECRET
      - TURNSTILE_SECRET
      - STRIPE_INTERNAL_SECRET
      - BLOCKSTREAM_CLIENT_ID
      - BLOCKSTREAM_CLIENT_SECRET
      # Pinned to Warning at deploy time (the CI deploy env does not forward
      # this variable, and compose v1 would render an unset bare passthrough as
      # null). To enable per-request logs temporarily, set it directly on the
      # running service:
      #   docker service update --env-add Logging__LogLevel__Default=Information vision_vapi
      # The next stack deploy resets it to Warning, so debug logging cannot be
      # left on by accident.
      - Logging__LogLevel__Default=${Logging__LogLevel__Default:-Warning}
    restart: always
    # Bound container logs so vapi can never grow the host's json-file logs
    # unchecked (the service itself defaults to Warning-level logging; set
    # Logging__LogLevel__Default=Information for per-request logs).
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    ports:
      - "4000:4000"
    hostname: vapi
    networks:
      - vision

  web:
    image: ecency/vision-web:latest
    stop_grace_period: 30s
    deploy:
      replicas: ${WEB_REPLICAS:-4}
      update_config:
        parallelism: 1
        delay: 15s
        order: start-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        order: start-first
      # Per-replica memory backstop. Web replicas plateau around 3.7GiB RSS
      # (with MALLOC_ARENA_MAX=2 below); this cap sits above that so a genuine
      # runaway is cgroup-OOM-killed and restarted in isolation instead of the
      # host global OOM-killer picking an arbitrary victim (on the smaller US
      # box it hit sshd/qemu-ga). 4.5GiB keeps 3 replicas (13.5GiB) under the
      # 15GiB US box with headroom for redis/vapi/OS, and stays above the EU/SG
      # plateaus too, so it never false-trips a healthy replica.
      resources:
        limits:
          memory: 4608M
    environment:
      - USE_PRIVATE
      - INTERNAL_API_HOST=http://vapi:4000
      - REDIS_URL=redis://redis:6379
      - HIVESIGNER_SECRET
      - HOSTING_INTERNAL_SECRET
      - NODE_ENV
      - PLAUSIBLE_API_KEY
      - NEXT_PUBLIC_GMAPS_MAP_ID
      - NEXT_PUBLIC_GMAPS_API_KEY
      - MATTERMOST_BASE_URL
      - MATTERMOST_ADMIN_TOKEN
      - MATTERMOST_TEAM_ID
      - MATTERMOST_WS_ALLOWED_ORIGINS
      - THREESPEAK_EMBED_API_KEY
      - SEO_CRON_SECRET
      # Newsletter service (ecency/news), single instance on the EU box. EU reaches it
      # on the swarm gateway address, US through the IP-allowlisted TLS relay on the EU
      # origin; each deploy job supplies its own URL and refuses to deploy without them.
      # The web tier decides per request whether the service is configured: unset = the
      # handlers answer 503 and no newsletter control renders (server/newsletter-internal
      # `newsletterFeatureEnabled`), so a deployment without the service stays quiet.
      - NEWSLETTER_API_URL
      - NEWSLETTER_SERVICE_TOKEN
      # Cloudflare Turnstile secret, for verifying the token an ANONYMOUS newsletter
      # subscribe carries (server/turnstile-verify). Shared with vapi, which declares it
      # above for the Stripe flow; the Next tier needs its own copy or every anonymous
      # subscribe answers 503, because an unset secret refuses rather than relaying with
      # the check off. specs/deploy/newsletter-wiring pins this line for that reason.
      - TURNSTILE_SECRET
      # Cap glibc malloc arenas (default 8*cores) so freed memory is returned to
      # the OS instead of being retained per-arena. Cuts Next.js SSR RSS (which
      # ran ~2x the V8 heap due to arena fragmentation) with no latency cost:
      # rendering is single-threaded, so arena lock contention does not apply.
      - MALLOC_ARENA_MAX=2
      # Bound the V8 old-space so a pathological single render crashes (and the
      # replica restarts) rather than ballooning the heap unbounded. Heap working
      # set is ~2GiB, so 3GiB leaves headroom without clipping normal renders.
      # The semi-space (young generation) is raised from V8's default so an
      # allocation-heavy render triggers fewer scavenges; costs ~128MiB of RSS
      # per replica, well inside the limit above.
      - NODE_OPTIONS=--max-old-space-size=3072 --max-semi-space-size=64
      # Per-process admission control (ssr-admission.js, loaded by the image
      # CMD): above this many in-flight page renders the process answers 503
      # with Retry-After, which the edge worker treats as a failover signal.
      # Normal load is a handful of renders in flight per process; the cap only
      # bites once renders have slowed enough to pile up, which is exactly the
      # state that used to end in a heap abort. Unset or 0 disables it.
      - SSR_MAX_INFLIGHT=16
    restart: always
    ports:
      - "3000:3000"
    hostname: web
    networks:
      - vision

  # Single internal scheduler for the SEO maintenance route (sitemap
  # regeneration, hourly).
  # One manager-pinned replica, so the cron fires exactly once per swarm —
  # not once per web replica. It only ever talks to web:3000 over the
  # internal `vision` overlay, so the x-seo-cron-secret header never crosses
  # the public edge / Cloudflare. No published ports; the secret is injected
  # from the deploy environment and is never echoed (curl output discarded).
  # $$ escapes keep the loop's $ literal through `docker-compose config`.
  seocron:
    image: curlimages/curl:8.11.1
    environment:
      - SEO_CRON_SECRET
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Fail fast (and crash-loop visibly) rather than silently no-op if
        # the secret never made it into the deploy environment.
        if [ -z "$$SEO_CRON_SECRET" ]; then
          echo "seocron: SEO_CRON_SECRET is empty/unset - refusing to start" >&2
          exit 1
        fi
        # Deploy-time prime: /sitemap.xml is advertised in robots.txt, so it
        # must not 404 until the first hour boundary. Retry covers web not
        # being ready yet (swarm starts services in parallel; depends_on is
        # not honored).
        P=0
        while [ "$$P" -lt 30 ]; do
          if curl -fsS --max-time 180 -X POST -H "x-seo-cron-secret: $$SEO_CRON_SECRET" http://web:3000/api/internal/seo/sitemap-generate >/dev/null 2>&1; then
            break
          fi
          P=$$((P + 1))
          sleep 10
        done
        while true; do
          S=$$(( 3600 - $$(date -u +%s) % 3600 ))
          sleep "$$S"
          curl -fsS --max-time 180 -X POST -H "x-seo-cron-secret: $$SEO_CRON_SECRET" http://web:3000/api/internal/seo/sitemap-generate >/dev/null 2>&1 || true
        done
    restart: always
    hostname: seocron
    networks:
      - vision
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

  # Per-stack Redis used as the L2 cache for post-age lookups in the Next.js
  # middleware (see apps/web/src/features/next-middleware/post-age-cache.ts).
  # Each origin server runs a single-node swarm, so today this is also a
  # per-host Redis. If an origin is ever scaled to multi-node, revisit:
  # `replicas: 1` + manager constraint means one Redis for the whole swarm,
  # not one per node — would need `mode: global` + service discovery work.
  # Lives only on the docker overlay network — never publish 6379 publicly.
  # Persistence: AOF every 1s (acceptable <1s write loss for a refetchable cache).
  # Memory cap: 1gb LRU — well above the post-age working set; headroom for
  # future cache layers (API responses, profile/community metadata) on this
  # same instance without re-sizing.
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 1gb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
    restart: always
    hostname: redis
    networks:
      - vision
    volumes:
      - redis_data:/data
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

networks:
  vision:
    external: true

volumes:
  redis_data:
